<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>本機收件匣</title>

    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#8a5a2b" />
    <link rel="icon" href="./icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="收件匣" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>本機收件匣</h1>
      <input id="search" type="search" placeholder="搜尋主旨、寄件者、內容…" autocomplete="off" />
      <select id="folder"><option value="">全部資料夾</option></select>
      <button id="sync" type="button">收信</button>
      <button id="notify" type="button" hidden>開啟通知</button>
      <span id="count"></span>
    </header>

    <div id="banner" hidden></div>

    <main>
      <ul id="messages" aria-label="信件列表"></ul>
      <article id="reader"><p class="empty">選一封信來讀。</p></article>
    </main>

    <script type="module" src="./app.js"></script>
    <script>
      // Registered outside the module so a syntax error in app.js still leaves
      // the installed app able to boot from cache.
      if ('serviceWorker' in navigator) {
        addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
